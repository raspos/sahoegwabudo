name: 통계 자료 갱신 (월 1회)
# 원자료 수집 → 검증 → 통과할 때만 public/data 교체 → 바뀐 점이 있으면 PR 로 올린다 (사람이 확인 후 병합)
on:
  schedule:
    - cron: '0 3 5 * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci
      # 수집이 일부 실패해도 기존 원자료는 남는다. 검증(build.py)에 실패하면 public/data 는 바뀌지 않는다.
      - run: python -I pipeline/fetch.py || echo "일부 원자료 수집 실패 - 기존 원자료로 진행"
      - run: python -I pipeline/build.py
      - run: npm test
      - name: 변경 사항 PR
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          if git diff --quiet -- public/data data/raw && [ -z "$(git status --porcelain public/data data/raw)" ]; then echo "변경 없음"; exit 0; fi
          b="data/$(date +%Y%m%d)"
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -b "$b"
          git add public/data data/raw data/validation_report.json  # data/raw/wb 는 .gitignore
          git commit -m "통계 자료 갱신 $(date +%Y-%m-%d)"
          git push origin "$b"
          gh pr create --title "통계 자료 갱신 $(date +%Y-%m-%d)" --body "World Bank WDI 등 원자료 재수집. 검증 통과. data/validation_report.json 경고를 확인한 뒤 병합하세요."
